name: build-wiiu
# Only run on PRs and pushes to main. Running on every branch push as well would
# double-fire for PR branches and hammer the devkitPro package mirror (which
# rate-limits DB syncs with HTTP 403).
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-wiiu:
    runs-on: ubuntu-latest
    # The official devkitPro image ships the devkitPPC/wut toolchain and the
    # WiiU CMake toolchain file used to cross-compile for the console.
    container:
      image: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii U dependencies
        run: |
          # Portlibs the core links against.
          #
          # The devkitPro mirror frequently returns HTTP 403 when syncing the
          # package databases (dkp-*.db) from GitHub Actions. The image already
          # ships a populated pacman DB, so first try installing WITHOUT a DB
          # sync (-S, no -y) which only fetches the package files. Fall back to
          # a full sync with backoff only if a package is missing locally.
          PKGS="wiiu-cmake wiiu-pkg-config ppc-tinyxml2 ppc-libzip ppc-zlib ppc-bzip2"
          if dkp-pacman -S --needed --noconfirm $PKGS; then
            exit 0
          fi
          echo "Install without DB sync failed; falling back to synced install"
          for attempt in 1 2 3 4 5; do
            if dkp-pacman -Syu --needed --noconfirm $PKGS; then
              exit 0
            fi
            echo "dkp-pacman sync attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "dkp-pacman failed after retries" >&2
          exit 1
      - name: Install Python dependencies
        run: |
          python3 -m pip install -r requirements.txt --break-system-packages \
            || python3 -m pip install -r requirements.txt \
            || pip3 install -r requirements.txt --break-system-packages \
            || true
      - name: Configure
        run: |
          source /etc/profile.d/devkit-env.sh || true
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          cmake --no-warn-unused-cli -H. -Bbuild-wiiu -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/WiiU.cmake \
            -DCMAKE_BUILD_TYPE:STRING=Release
      # The core Wii U library (with the GX2 renderer gated behind LUS_WIIU_GX2)
      # now compiles and links end to end, so this step is blocking. The GX2
      # renderer conversion and native input/audio are tracked in
      # docs/wiiu-port-status.md.
      - name: Build
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          cmake --build build-wiiu --config Release --parallel
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: libultraship-wiiu
          path: build-wiiu/src/*.a
          if-no-files-found: error

  # Phase B diagnostic job: cross-compiles the experimental GX2 renderer /
  # Wii U window backend (-DLUS_WIIU_GX2=ON). Those sources are still being
  # converted from the old C struct-of-function-pointers Fast3D API to the
  # class-based GfxRenderingAPI / GfxWindowBackend interfaces, so this job is
  # intentionally NON-BLOCKING (continue-on-error) for now: it exists to
  # surface the concrete remaining GX2 compile errors on real devkitPPC output
  # while the conversion is in progress. Ninja is run with `-k 0` so a single
  # error does not hide the rest. Flip this to blocking (and fold it into the
  # main build-wiiu job) once the GX2 backend compiles — see
  # docs/wiiu-port-status.md and the revert checklist in CLAUDE.md.
  build-wiiu-gx2:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Wii U dependencies
        run: |
          # Same install strategy as build-wiiu: prefer the image's populated
          # pacman DB (-S, no -y) and only fall back to a synced install with
          # backoff. The GX2 backend links against the same portlibs.
          PKGS="wiiu-cmake wiiu-pkg-config ppc-tinyxml2 ppc-libzip ppc-zlib ppc-bzip2"
          if dkp-pacman -S --needed --noconfirm $PKGS; then
            exit 0
          fi
          echo "Install without DB sync failed; falling back to synced install"
          for attempt in 1 2 3 4 5; do
            if dkp-pacman -Syu --needed --noconfirm $PKGS; then
              exit 0
            fi
            echo "dkp-pacman sync attempt $attempt failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          echo "dkp-pacman failed after retries" >&2
          exit 1
      - name: Install Python dependencies
        run: |
          python3 -m pip install -r requirements.txt --break-system-packages \
            || python3 -m pip install -r requirements.txt \
            || pip3 install -r requirements.txt --break-system-packages \
            || true
      - name: Configure (LUS_WIIU_GX2=ON)
        run: |
          source /etc/profile.d/devkit-env.sh || true
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          cmake --no-warn-unused-cli -H. -Bbuild-wiiu-gx2 -GNinja \
            -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/WiiU.cmake \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DLUS_WIIU_GX2=ON
      # NON-BLOCKING on purpose while the GX2 backend is being ported. `-k 0`
      # tells Ninja to keep going after the first failure so the whole error
      # surface shows up in one run.
      - name: Build (non-blocking, keep going)
        continue-on-error: true
        run: |
          export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
          cmake --build build-wiiu-gx2 --config Release --parallel -- -k 0
